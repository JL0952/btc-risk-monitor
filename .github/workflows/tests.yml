name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: btc_risk
          POSTGRES_PASSWORD: ci_local_password
          POSTGRES_DB: btc_risk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U btc_risk -d btc_risk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: btc_risk
      POSTGRES_PASSWORD: ci_local_password
      POSTGRES_DB: btc_risk
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.lock -e '.[test]'
      - name: Apply migrations
        run: python -m btc_risk.database.migrate
      - name: Test (excluding Docker lifecycle persistence checks)
        run: python -m pytest -q -m 'not persistence'
